<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Fruit Ninja Progressive Difficulty</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
overflow:hidden;
font-family:Arial,sans-serif;
background:linear-gradient(to bottom,#6ec6ff,#eaf8ff);
touch-action:none;
}

canvas{
display:block;
}

#menu{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.35);
backdrop-filter:blur(8px);
z-index:10;
}

#menu h1{
font-size:52px;
color:white;
margin-bottom:20px;
text-shadow:0 4px 15px rgba(0,0,0,.3);
}

#startBtn{
padding:15px 35px;
font-size:22px;
border:none;
border-radius:12px;
cursor:pointer;
background:#00c853;
color:white;
}

#hud{
position:fixed;
top:15px;
left:15px;
padding:12px 18px;
border-radius:14px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(10px);
color:white;
font-size:20px;
font-weight:bold;
display:none;
z-index:5;
}

.floatScore{
position:fixed;
color:white;
font-size:22px;
font-weight:bold;
pointer-events:none;
animation:floatUp 1s linear forwards;
z-index:100;
}

@keyframes floatUp{
from{
opacity:1;
transform:translateY(0);
}
to{
opacity:0;
transform:translateY(-60px);
}
}
</style>
</head>
<body>

<div id="menu">
<h1>🍉 Fruit Ninja</h1>
<button id="startBtn">Start Game</button>
</div>

<div id="hud">
Score: <span id="score">0</span>
&nbsp; | &nbsp;
Level: <span id="level">1</span>
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
const dpr=window.devicePixelRatio||1;

canvas.width=innerWidth*dpr;
canvas.height=innerHeight*dpr;

canvas.style.width=innerWidth+"px";
canvas.style.height=innerHeight+"px";

ctx.setTransform(dpr,0,0,dpr,0,0);
}

resize();
window.addEventListener("resize",resize);

let running=false;
let score=0;

const scoreEl=document.getElementById("score");
const levelEl=document.getElementById("level");

const fruits=[];
const particles=[];
const trail=[];

class Fruit{

constructor(){

const types=[
"apple",
"orange",
"watermelon",
"banana",
"mango"
];

this.type=
types[Math.floor(Math.random()*types.length)];

this.size=38;

this.x=Math.random()*(innerWidth-120)+60;
this.y=innerHeight+100;

const difficulty=
1+(score*0.02);

this.vx=
(Math.random()-0.5)*
(2*difficulty);

this.vy=
-(7+Math.random()*2)*
difficulty;

this.gravity=
0.06+(score*0.0005);

this.rot=0;
this.rotSpeed=
(Math.random()-0.5)*0.05;
}

update(){

this.x+=this.vx;
this.y+=this.vy;

this.vy+=this.gravity;

this.rot+=this.rotSpeed;
}

draw(){

ctx.save();

ctx.translate(
this.x,
this.y
);

ctx.rotate(this.rot);

switch(this.type){

case "apple":

ctx.fillStyle="#e53935";
ctx.beginPath();
ctx.arc(0,0,this.size,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#2e7d32";
ctx.fillRect(-2,-45,4,15);

break;

case "orange":

ctx.fillStyle="#fb8c00";
ctx.beginPath();
ctx.arc(0,0,this.size,0,Math.PI*2);
ctx.fill();

break;

case "watermelon":

ctx.fillStyle="#2e7d32";
ctx.beginPath();
ctx.arc(0,0,this.size,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#ff5252";
ctx.beginPath();
ctx.arc(0,0,this.size-6,0,Math.PI*2);
ctx.fill();

break;

case "banana":

ctx.strokeStyle="#ffd600";
ctx.lineWidth=18;
ctx.beginPath();
ctx.arc(0,0,24,0.5,2.6);
ctx.stroke();

break;

case "mango":

ctx.fillStyle="#ffb300";
ctx.beginPath();
ctx.ellipse(
0,0,
30,
40,
0,
0,
Math.PI*2
);
ctx.fill();

break;
}

ctx.restore();
}
}

class Particle{

constructor(x,y){

this.x=x;
this.y=y;

this.vx=(Math.random()-0.5)*5;
this.vy=(Math.random()-0.5)*5;

this.life=30;
}

update(){

this.x+=this.vx;
this.y+=this.vy;

this.life--;
}

draw(){

ctx.fillStyle=
`rgba(255,255,255,${this.life/30})`;

ctx.beginPath();
ctx.arc(
this.x,
this.y,
3,
0,
Math.PI*2
);

ctx.fill();
}
}

function floatScore(x,y){

const el=
document.createElement("div");

el.className="floatScore";
el.textContent="+1";

el.style.left=x+"px";
el.style.top=y+"px";

document.body.appendChild(el);

setTimeout(()=>{
el.remove();
},1000);
}

function updateLevel(){

const level=
Math.floor(score/20)+1;

levelEl.textContent=level;
}

function slice(x,y){

for(
let i=fruits.length-1;
i>=0;
i--
){

const f=fruits[i];

const dx=f.x-x;
const dy=f.y-y;

const dist=
Math.sqrt(
dx*dx+
dy*dy
);

if(dist<55){

score++;

scoreEl.textContent=score;

updateLevel();

floatScore(
f.x,
f.y
);

for(let p=0;p<15;p++){

particles.push(
new Particle(
f.x,
f.y
)
);
}

fruits.splice(i,1);
}
}
}

function spawnWave(){

if(!running) return;

let count=1;

if(score>20) count=2;
if(score>50) count=3;
if(score>100) count=4;
if(score>200) count=5;

for(
let i=0;
i<count;
i++
){
fruits.push(
new Fruit()
);
}
}

setInterval(
spawnWave,
1200
);

canvas.addEventListener(
"mousemove",
e=>{

trail.push({
x:e.clientX,
y:e.clientY
});

slice(
e.clientX,
e.clientY
);
});

let touching=false;

canvas.addEventListener(
"touchstart",
e=>{

touching=true;

const t=e.touches[0];

trail.push({
x:t.clientX,
y:t.clientY
});

slice(
t.clientX,
t.clientY
);

},
{passive:true}
);

canvas.addEventListener(
"touchmove",
e=>{

if(!touching) return;

const t=e.touches[0];

trail.push({
x:t.clientX,
y:t.clientY
});

slice(
t.clientX,
t.clientY
);

},
{passive:true}
);

canvas.addEventListener(
"touchend",
()=>{
touching=false;
}
);

function drawTrail(){

if(trail.length<2)
return;

ctx.beginPath();

ctx.moveTo(
trail[0].x,
trail[0].y
);

for(
const p of trail
){
ctx.lineTo(
p.x,
p.y
);
}

ctx.strokeStyle=
"rgba(255,255,255,.9)";

ctx.lineWidth=5;
ctx.lineCap="round";

ctx.stroke();

while(
trail.length>10
){
trail.shift();
}
}

function loop(){

ctx.clearRect(
0,
0,
innerWidth,
innerHeight
);

drawTrail();

for(
let i=fruits.length-1;
i>=0;
i--
){

fruits[i].update();
fruits[i].draw();

if(
fruits[i].y>
innerHeight+150
){
fruits.splice(i,1);
}
}

for(
let i=particles.length-1;
i>=0;
i--
){

particles[i].update();
particles[i].draw();

if(
particles[i].life<=0
){
particles.splice(i,1);
}
}

requestAnimationFrame(loop);
}

loop();

document
.getElementById("startBtn")
.onclick=()=>{

document
.getElementById("menu")
.style.display="none";

document
.getElementById("hud")
.style.display="block";

running=true;
};

</script>

</body>
</html>
